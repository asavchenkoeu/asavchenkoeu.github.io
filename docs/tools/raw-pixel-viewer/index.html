      }

      function bayerColor(pattern, x, y) {
        return pattern[((y & 1) << 1) | (x & 1)];
      }

      function decodeBayerFromReader(s, rawReader, rawMax, expectedBytes, rawName) {
        const w = s.width;
        const h = s.height;
        const pattern = s.bayerPattern || "RGGB";
        const rgba = new Uint8ClampedArray(w * h * 4);

        function getRawSafe(x, y) {
          const cx = x < 0 ? 0 : x >= w ? w - 1 : x;
          const cy = y < 0 ? 0 : y >= h ? h - 1 : y;
          return rawReader(cx, cy);
        }

        function avgNeighborColor(x, y, target) {
          let sum = 0;
          let count = 0;
          for (let dy = -1; dy <= 1; dy += 1) {
            for (let dx = -1; dx <= 1; dx += 1) {
              const nx = x + dx;
              const ny = y + dy;
              const cx = nx < 0 ? 0 : nx >= w ? w - 1 : nx;
              const cy = ny < 0 ? 0 : ny >= h ? h - 1 : ny;
              if (bayerColor(pattern, cx, cy) === target) {
                sum += rawReader(cx, cy);
                count += 1;
              }
            }
          }
          if (count === 0) return getRawSafe(x, y);
          return sum / count;
        }

        let out = 0;
        for (let y = 0; y < h; y += 1) {
          for (let x = 0; x < w; x += 1) {
            const c = bayerColor(pattern, x, y);
            const v = rawReader(x, y);
            let rr;
            let gg;
            let bb;

            if (!s.demosaic) {
              rr = v;
              gg = v;
              bb = v;
            } else {
              if (c === "R") {
                rr = v;
                gg = avgNeighborColor(x, y, "G");
                bb = avgNeighborColor(x, y, "B");
              } else if (c === "B") {
                rr = avgNeighborColor(x, y, "R");
                gg = avgNeighborColor(x, y, "G");
                bb = v;
              } else {
                rr = avgNeighborColor(x, y, "R");
                gg = v;
                bb = avgNeighborColor(x, y, "B");
              }
            }

            let r = clampByte((rr * 255) / rawMax);
            let g = clampByte((gg * 255) / rawMax);
            let b = clampByte((bb * 255) / rawMax);
            [r, g, b] = applyLinearDisplay(r, g, b, s);
            if (s.swapRB) {
              const t = r;
              r = b;
              b = t;
            }

            rgba[out] = r;
            rgba[out + 1] = g;
            rgba[out + 2] = b;
            rgba[out + 3] = 255;
            out += 4;
          }
        }

        return {
          rgba,
          expectedBytes,
          getRaw: (x, y) => {
            const value = getRawSafe(x, y);
            return {
              [rawName]: value,
              CFA: bayerColor(pattern, x, y)
            };
          }
        };
      }

      function decodeBayer8(bytes, s) {
        const w = s.width;
        const h = s.height;
        const offset = s.offset;
        const stride = s.stride0 > 0 ? s.stride0 : w;
        const expectedBytes = offset + stride * h;

        function readRaw(x, y) {
          return byteAt(bytes, offset + y * stride + x);
        }

        return decodeBayerFromReader(s, readRaw, 255, expectedBytes, "RAW8");
      }

      function decodeBayer16(bytes, s) {
        const w = s.width;
        const h = s.height;
        const offset = s.offset;
        const stride = s.stride0 > 0 ? s.stride0 : w * 2;
        const bitDepth = Math.max(8, Math.min(16, s.bayerBitDepth | 0));
        const mask = bitDepth >= 16 ? 0xffff : ((1 << bitDepth) - 1);
        const expectedBytes = offset + stride * h;

        function readRaw(x, y) {
          const p = offset + y * stride + x * 2;
          const lo = byteAt(bytes, p);
          const hi = byteAt(bytes, p + 1);
          const word = s.byteOrder === "big" ? ((lo << 8) | hi) : (lo | (hi << 8));
          return word & mask;
        }

        return decodeBayerFromReader(s, readRaw, mask || 65535, expectedBytes, `RAW${bitDepth}`);
      }

      function decodeBayer10Mipi(bytes, s) {
        const w = s.width;
        const h = s.height;
        const offset = s.offset;
        const stride = s.stride0 > 0 ? s.stride0 : Math.ceil(w / 4) * 5;
        const expectedBytes = offset + stride * h;

        function readRaw(x, y) {
          const group = x >> 2;
          const p = offset + y * stride + group * 5;
          const b0 = byteAt(bytes, p);
          const b1 = byteAt(bytes, p + 1);
          const b2 = byteAt(bytes, p + 2);
          const b3 = byteAt(bytes, p + 3);
          const b4 = byteAt(bytes, p + 4);
          const idx = x & 3;
          if (s.byteOrder === "big") {
            if (idx === 0) return (b0 << 2) | ((b4 >> 6) & 0x03);
            if (idx === 1) return (b1 << 2) | ((b4 >> 4) & 0x03);
            if (idx === 2) return (b2 << 2) | ((b4 >> 2) & 0x03);
            return (b3 << 2) | (b4 & 0x03);
          }
          if (idx === 0) return b0 | ((b4 & 0x03) << 8);
          if (idx === 1) return b1 | ((b4 & 0x0c) << 6);
          if (idx === 2) return b2 | ((b4 & 0x30) << 4);
          return b3 | ((b4 & 0xc0) << 2);
        }

        return decodeBayerFromReader(s, readRaw, 1023, expectedBytes, "RAW10");
      }

      function decodeBayer12Mipi(bytes, s) {
        const w = s.width;
        const h = s.height;
        const offset = s.offset;
        const stride = s.stride0 > 0 ? s.stride0 : Math.ceil(w / 2) * 3;
        const expectedBytes = offset + stride * h;

        function readRaw(x, y) {
          const pair = x >> 1;
          const p = offset + y * stride + pair * 3;
          const b0 = byteAt(bytes, p);
          const b1 = byteAt(bytes, p + 1);
          const b2 = byteAt(bytes, p + 2);
          if (s.byteOrder === "big") {
            if ((x & 1) === 0) {
              return (b0 << 4) | ((b2 >> 4) & 0x0f);
            }
            return (b1 << 4) | (b2 & 0x0f);
          }
          if ((x & 1) === 0) {
            return b0 | ((b2 & 0x0f) << 8);
          }
          return b1 | ((b2 & 0xf0) << 4);
        }

        return decodeBayerFromReader(s, readRaw, 4095, expectedBytes, "RAW12");
      }

      function estimateBytes(settings) {
        const s = settings;
        const w = Math.max(1, s.width | 0);
        const h = Math.max(1, s.height | 0);
        const offset = Math.max(0, s.offset | 0);
        const yuvBytes = yuvSampleInfo(s).bytesPerSample;

        switch (s.format) {
          case "nv12":
          case "nv21": {
            const y = (s.stride0 > 0 ? s.stride0 : w * yuvBytes) * h;
            const uv = (s.stride1 > 0 ? s.stride1 : w * yuvBytes) * Math.ceil(h / 2);
            return offset + y + uv;
          }
          case "nv16":
          case "nv61": {
            const y = (s.stride0 > 0 ? s.stride0 : w * yuvBytes) * h;
            const uv = (s.stride1 > 0 ? s.stride1 : w * yuvBytes) * h;
            return offset + y + uv;
          }
          case "yuyv":
          case "uyvy":
            return offset + (s.stride0 > 0 ? s.stride0 : w * 2 * yuvBytes) * h;
          case "i420":
          case "yv12": {
            const cw = Math.ceil(w / 2);
            const ch = Math.ceil(h / 2);
            const y = (s.stride0 > 0 ? s.stride0 : w * yuvBytes) * h;
            const u = (s.stride1 > 0 ? s.stride1 : cw * yuvBytes) * ch;
            const v = (s.stride2 > 0 ? s.stride2 : cw * yuvBytes) * ch;
            return offset + y + u + v;
          }
          case "yuv422p":
          case "yvu422p": {
            const cw = Math.ceil(w / 2);
            const y = (s.stride0 > 0 ? s.stride0 : w * yuvBytes) * h;
            const u = (s.stride1 > 0 ? s.stride1 : cw * yuvBytes) * h;
            const v = (s.stride2 > 0 ? s.stride2 : cw * yuvBytes) * h;
            return offset + y + u + v;
          }
          case "gray8":
            return offset + (s.stride0 > 0 ? s.stride0 : w) * h;
          case "rgb24":
          case "bgr24":
            return offset + (s.stride0 > 0 ? s.stride0 : w * 3) * h;
          case "rgba32":
          case "bgra32":
          case "argb32":
          case "abgr32":
            return offset + (s.stride0 > 0 ? s.stride0 : w * 4) * h;
          case "bayer8":
            return offset + (s.stride0 > 0 ? s.stride0 : w) * h;
          case "bayer16":
            return offset + (s.stride0 > 0 ? s.stride0 : w * 2) * h;
          case "bayer10mipi":
            return offset + (s.stride0 > 0 ? s.stride0 : Math.ceil(w / 4) * 5) * h;
          case "bayer12mipi":
            return offset + (s.stride0 > 0 ? s.stride0 : Math.ceil(w / 2) * 3) * h;
          default:
            return offset;
        }
      }

      function getActiveDecoded() {
        return ensureDecoded(slots[activeSlot]);
      }

      function updateStatus(target = null) {
        const info = target || getRenderTarget();
        if (info.mode === "diff") {
          const slotA = info.slotA;
          const slotB = info.slotB;
          if (!slotA || !slotB) {
            fileStatus.innerHTML = "Diff mode: need two loaded slots";
            warnStatus.className = "warn";
            warnStatus.textContent = info.error || "";
            return;
          }
          fileStatus.innerHTML =
            `<strong>Diff</strong> S${slotA.id + 1}:${escapeHtml(slotA.fileName || "empty")} ` +
            `vs S${slotB.id + 1}:${escapeHtml(slotB.fileName || "empty")} | ` +
            `A:${slotA.bytes.length.toLocaleString()} bytes, B:${slotB.bytes.length.toLocaleString()} bytes`;
          warnStatus.className = info.error ? "warn" : "";
          warnStatus.textContent = info.error || "Diff image: per-channel absolute RGB difference";
          return;
        }

        const slot = info.slot || slots[activeSlot];
        if (!slot.bytes) {
          fileStatus.innerHTML = "No file loaded in this slot";
          warnStatus.textContent = "";
          pixelStatus.textContent = "Pixel: -";
          return;
        }

        const s = slot.settings;
        const expected = estimateBytes(s);
        const delta = slot.bytes.length - expected;
        const formatLabel = formatInfo(s.format).label;

        fileStatus.innerHTML =
          `<strong>${escapeHtml(slot.fileName)}</strong> | ${slot.bytes.length.toLocaleString()} bytes | ` +
          `${formatLabel} | ${s.width}x${s.height}`;

        const pieces = [`Expected ~${expected.toLocaleString()} bytes`];
        if (delta !== 0) {
          const sign = delta > 0 ? "+" : "";
          pieces.push(`delta ${sign}${delta.toLocaleString()}`);
        }

        warnStatus.className = delta === 0 && !slot.error ? "" : "warn";
        warnStatus.textContent = slot.error
          ? `Decode error: ${slot.error}`
          : pieces.join(" | ");
      }

      function canvasCssSize() {
        const rect = canvasWrap.getBoundingClientRect();
        return { width: Math.max(1, rect.width), height: Math.max(1, rect.height) };
      }

      function ensureCanvasResolution() {
        const dpr = window.devicePixelRatio || 1;
        const size = canvasCssSize();
        const w = Math.max(1, Math.round(size.width * dpr));
        const h = Math.max(1, Math.round(size.height * dpr));
        if (viewerCanvas.width !== w || viewerCanvas.height !== h) {
          viewerCanvas.width = w;
          viewerCanvas.height = h;
        }
        return { dpr, width: size.width, height: size.height };
      }

      function ensureHistogramResolution() {
        const dpr = window.devicePixelRatio || 1;
        const rect = histogramCanvas.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width * dpr));
        const h = Math.max(1, Math.round(rect.height * dpr));
        if (histogramCanvas.width !== w || histogramCanvas.height !== h) {
          histogramCanvas.width = w;
          histogramCanvas.height = h;
        }
        return { dpr, width: Math.max(1, rect.width), height: Math.max(1, rect.height) };
      }

      function computeHistogram(rgba) {
        const r = new Uint32Array(256);
        const g = new Uint32Array(256);
        const b = new Uint32Array(256);
        const l = new Uint32Array(256);
        let max = 1;

        for (let i = 0; i < rgba.length; i += 4) {
          const rv = rgba[i];
          const gv = rgba[i + 1];
          const bv = rgba[i + 2];
          r[rv] += 1;
          g[gv] += 1;
          b[bv] += 1;
          const lv = clampByte(0.299 * rv + 0.587 * gv + 0.114 * bv);
          l[lv] += 1;
        }

        for (let i = 0; i < 256; i += 1) {
          if (r[i] > max) max = r[i];
          if (g[i] > max) max = g[i];
          if (b[i] > max) max = b[i];
          if (l[i] > max) max = l[i];
        }

        return { r, g, b, l, max };
      }

      function ensureHistogramForTarget(target) {
        if (!target || !target.decoded || !target.decoded.rgba) return null;
        if (target.mode === "diff") {
          if (diffHistogramCache.data && diffHistogramCache.key === diffCache.key) return diffHistogramCache.data;
          const data = computeHistogram(target.decoded.rgba);
          diffHistogramCache = { key: diffCache.key, data };
          return data;
        }

        const slot = target.slot;
        if (slot.histogram && slot.histogramKey === slot.decodedKey) return slot.histogram;
        const data = computeHistogram(slot.decoded.rgba);
        slot.histogram = data;
        slot.histogramKey = slot.decodedKey;
        return data;
      }

      function clearHistogramPanel(text = "Histogram: -") {
        const { dpr, width, height } = ensureHistogramResolution();
        histogramCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        histogramCtx.clearRect(0, 0, width, height);
        histogramCtx.fillStyle = "rgba(8,14,22,0.95)";
        histogramCtx.fillRect(0, 0, width, height);
        histogramCtx.fillStyle = "#8fa3ba";
        histogramCtx.font = "12px Segoe UI";
        histogramCtx.fillText("No histogram", 10, height * 0.5);
        histogramLabel.textContent = text;
      }

      function drawHistogramPanel(target) {
        const hist = ensureHistogramForTarget(target);
        if (!hist) {
          clearHistogramPanel("Histogram: -");
          return;
        }

        const { dpr, width, height } = ensureHistogramResolution();
        const ctx = histogramCtx;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "rgba(8,14,22,0.95)";
        ctx.fillRect(0, 0, width, height);

        const left = 8;
        const top = 8;
        const w = width - 16;
        const h = height - 14;

        ctx.strokeStyle = "rgba(180,200,220,0.16)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i <= 4; i += 1) {
          const x = left + (w * i) / 4;
          ctx.moveTo(x, top);
          ctx.lineTo(x, top + h);
        }
        for (let i = 0; i <= 3; i += 1) {
          const y = top + (h * i) / 3;
          ctx.moveTo(left, y);
          ctx.lineTo(left + w, y);
        }
        ctx.stroke();

        function drawLine(arr, color) {
          ctx.beginPath();
          for (let i = 0; i < 256; i += 1) {
            const x = left + (i / 255) * w;
            const y = top + h - (arr[i] / hist.max) * h;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }

        drawLine(hist.l, "rgba(235,235,235,0.8)");
        drawLine(hist.r, "rgba(255,95,95,0.82)");
        drawLine(hist.g, "rgba(110,255,130,0.82)");
        drawLine(hist.b, "rgba(110,155,255,0.82)");
        histogramLabel.textContent =
          target.mode === "diff"
            ? "Histogram: diff (R/G/B + Luma)"
            : `Histogram: slot ${activeSlot + 1} (R/G/B + Luma)`;
      }

      function saveCurrentImage() {
        const target = getRenderTarget();
        const slot = slots[activeSlot];
        const decoded = target.decoded;
        if (!decoded) return;
        const mime = saveFormatSelect.value === "image/jpeg" ? "image/jpeg" : "image/png";
        const ext = mime === "image/jpeg" ? "jpg" : "png";
        const base =
          target.mode === "diff"
            ? `diff_slot${target.slotA.id + 1}_slot${target.slotB.id + 1}`
            : (slot.fileName || `slot_${activeSlot + 1}`).replace(/\.[^.]+$/, "");
        const name = `${base}_${decoded.width}x${decoded.height}.${ext}`;

        const downloadBlob = (blob) => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = name;
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        };

        const quality = mime === "image/jpeg" ? 0.95 : undefined;
        if (decoded.canvas.toBlob) {
          decoded.canvas.toBlob(downloadBlob, mime, quality);
        } else {
          const dataUrl = decoded.canvas.toDataURL(mime, quality);
          const a = document.createElement("a");
          a.href = dataUrl;
          a.download = name;
          document.body.append(a);
          a.click();
          a.remove();
        }
      }

      function fitViewToImage(decoded) {
        const size = canvasCssSize();
        const zoom = Math.min(size.width / decoded.width, size.height / decoded.height);
        view.zoom = Math.max(view.minZoom, Math.min(view.maxZoom, zoom));
        view.panX = (size.width - decoded.width * view.zoom) * 0.5;
        view.panY = (size.height - decoded.height * view.zoom) * 0.5;
      }

      function resetView() {
        view.zoom = 1;
        view.panX = 0;
        view.panY = 0;
        scheduleRender();
      }

      function scheduleRender() {
        if (renderQueued) return;
        renderQueued = true;
        requestAnimationFrame(() => {
          renderQueued = false;
          render();
        });
      }

      function render() {
        const target = getRenderTarget();
        const decoded = target.decoded;
        const { dpr, width, height } = ensureCanvasResolution();
        const ctx = viewerCtx;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#0a1017";
        ctx.fillRect(0, 0, width, height);

        if (!decoded) {
          drawMessage(ctx, width, height, target.error || "Load a raw file into slots 1..4");
          clearHistogramPanel(target.mode === "diff" ? "Histogram: diff unavailable" : "Histogram: no file");
          pixelStatus.textContent = `Pixel: - | zoom ${view.zoom.toFixed(3)}x`;
          updateStatus(target);
          return;
        }

        if (!view.hasInitialFit) {
          fitViewToImage(decoded);
          view.hasInitialFit = true;
        }

        ctx.save();
        ctx.translate(view.panX, view.panY);
        ctx.scale(view.zoom, view.zoom);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(decoded.canvas, 0, 0);
        drawPixelGrid(ctx, decoded.width, decoded.height);
        ctx.restore();

        drawHoverPixelOutline(ctx, decoded);
        updatePixelStatus(decoded, target);
        drawHistogramPanel(target);
        updateStatus(target);
      }

      function drawMessage(ctx, width, height, text) {
        ctx.fillStyle = "#d0dae6";
        ctx.font = "13px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText(text, width / 2, height / 2);
      }

      function drawPixelGrid(ctx, w, h) {
        if (view.zoom < 12) return;
        const left = Math.max(0, Math.floor((-view.panX) / view.zoom));
        const right = Math.min(w, Math.ceil((canvasCssSize().width - view.panX) / view.zoom));
        const top = Math.max(0, Math.floor((-view.panY) / view.zoom));
        const bottom = Math.min(h, Math.ceil((canvasCssSize().height - view.panY) / view.zoom));

        ctx.beginPath();
        for (let x = left; x <= right; x += 1) {
          ctx.moveTo(x, top);
          ctx.lineTo(x, bottom);
        }
        for (let y = top; y <= bottom; y += 1) {
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
        }
        ctx.lineWidth = 1 / view.zoom;
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.stroke();
      }

      function pointerToImage(decoded) {
        if (pointerX < 0 || pointerY < 0) return null;
        const ix = Math.floor((pointerX - view.panX) / view.zoom);
        const iy = Math.floor((pointerY - view.panY) / view.zoom);
        if (ix < 0 || iy < 0 || ix >= decoded.width || iy >= decoded.height) return null;
        return { x: ix, y: iy };
      }

      function drawHoverPixelOutline(ctx, decoded) {
        const p = pointerToImage(decoded);
        if (!p || view.zoom < 8) return;

        const sx = view.panX + p.x * view.zoom;
        const sy = view.panY + p.y * view.zoom;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.strokeRect(sx + 0.5, sy + 0.5, Math.max(1, view.zoom - 1), Math.max(1, view.zoom - 1));
      }

      function updatePixelStatus(decoded, target = null) {
        const p = pointerToImage(decoded);
        if (!p) {
          pixelStatus.textContent = `Pixel: - | zoom ${view.zoom.toFixed(3)}x`;
          return;
        }

        const rgbaIndex = (p.y * decoded.width + p.x) * 4;
        const r = decoded.rgba[rgbaIndex];
        const g = decoded.rgba[rgbaIndex + 1];
        const b = decoded.rgba[rgbaIndex + 2];
        const a = decoded.rgba[rgbaIndex + 3];

        const rawObj = decoded.getRaw ? decoded.getRaw(p.x, p.y) : {};
        const rawText = Object.entries(rawObj)
          .map(([k, v]) => `${k}:${v}`)
          .join(" ");

        if (target && target.mode === "diff") {
          pixelStatus.textContent =
            `Diff Pixel (${p.x}, ${p.y}) dRGBA(${r}, ${g}, ${b}, ${a})` +
            (rawText ? ` | ${rawText}` : "") +
            ` | zoom ${view.zoom.toFixed(3)}x`;
        } else {
          pixelStatus.textContent =
            `Pixel (${p.x}, ${p.y}) RGBA(${r}, ${g}, ${b}, ${a})` +
            (rawText ? ` | ${rawText}` : "") +
            ` | zoom ${view.zoom.toFixed(3)}x`;
        }
      }

      function beginPan(ev) {
        if (ev.button !== 0) return;
        dragging = true;
        viewerCanvas.style.cursor = "grabbing";
      }

      function updatePointerPosition(ev) {
        const rect = canvasWrap.getBoundingClientRect();
        pointerX = ev.clientX - rect.left;
        pointerY = ev.clientY - rect.top;
      }

      function onWheel(ev) {
        ev.preventDefault();
        const decoded = getRenderTarget().decoded;
        if (!decoded) return;

        updatePointerPosition(ev);
        const oldZoom = view.zoom;
        const zoomFactor = Math.exp(-ev.deltaY * 0.0015);
        const newZoom = Math.max(view.minZoom, Math.min(view.maxZoom, oldZoom * zoomFactor));

        const mx = pointerX;
        const my = pointerY;
        view.panX = mx - ((mx - view.panX) / oldZoom) * newZoom;
        view.panY = my - ((my - view.panY) / oldZoom) * newZoom;
        view.zoom = newZoom;
        scheduleRender();
      }

      function onMouseMove(ev) {
        updatePointerPosition(ev);
        if (dragging) {
          view.panX += ev.movementX;
          view.panY += ev.movementY;
        }
        scheduleRender();
      }

      function endPan() {
        dragging = false;
        viewerCanvas.style.cursor = "default";
      }

      function setGuessOverlayVisible(visible) {
        guessOverlay.classList.toggle("open", visible);
      }

      function applyGuessCandidate(candidate) {
        const slot = slots[activeSlot];
        slot.settings = {
          ...slot.settings,
          ...candidate
        };
        slot.selectedProfileId = "";
        invalidateSlot(slot);
        syncControlsFromSlot();
        updateStatus();
        scheduleRender();
        setGuessOverlayVisible(false);
      }

      function settingsLabel(s) {
        const core = `${s.format} ${s.width}x${s.height}`;
        if (formatInfo(s.format).kind === "yuv") {
          const depth = Math.max(8, Math.min(16, s.yuvBitDepth | 0));
          return depth > 8 ? `${core} ${depth}-bit ${s.byteOrder === "big" ? "BE" : "LE"}` : core;
        }
        if (!s.format.startsWith("bayer")) return core;
        const extra = [];
        if (s.format === "bayer16") extra.push(`${s.bayerBitDepth}-bit`);
        if (s.format.includes("mipi") || s.format === "bayer16") {
          extra.push(s.byteOrder === "big" ? "BE" : "LE");
        }
        return `${core} ${s.bayerPattern} ${extra.join(" ")}`.trim();
      }

      function candidateKey(s) {
        return `${s.format}|${s.width}|${s.height}|${s.bayerPattern}|${s.byteOrder}|${s.yuvBitDepth}|${s.bayerBitDepth}`;
      }

      function parseGuessWidths(text) {
        const parts = String(text || "")
          .split(/[^0-9]+/)
          .map((x) => clampInt(x, 0, 0))
          .filter((x) => x >= 64 && x <= 16384);
        const unique = [...new Set(parts)];
        return unique.length > 0 ? unique : [1024, 1280, 1920];
      }

      function parseGuessAspect(mode, base) {
        if (mode === "auto") {
          const ratio = base.height > 0 ? base.width / base.height : 4 / 3;
          return ratio > 0 ? ratio : 4 / 3;
        }
        const match = /^(\d+(?:\.\d+)?)\s*:\s*(\d+(?:\.\d+)?)$/.exec(mode);
        if (!match) return 4 / 3;
        const aw = Number(match[1]);
        const ah = Number(match[2]);
        if (!Number.isFinite(aw) || !Number.isFinite(ah) || aw <= 0 || ah <= 0) return 4 / 3;
        return aw / ah;
      }

      function readGuessOptions() {
        return {
          dimMode: guessDimModeSelect.value,
          aspect: guessAspectSelect.value,
          widths: parseGuessWidths(guessWidthsInput.value),
          testYuv: !!guessYuvInput.checked,
          testRgb: !!guessRgbInput.checked,
          testBayer: !!guessBayerInput.checked,
          bayerBothEndians: !!guessBayerEndianBothInput.checked
        };
      }

      function buildGuessDimensions(base, opts) {
        const dims = [];
        const seen = new Set();
        const addDim = (w, h) => {
          const ww = clampInt(w, 0, 1);
          const hh = clampInt(h, 0, 1);
          const key = `${ww}x${hh}`;
          if (!seen.has(key)) {
            seen.add(key);
            dims.push([ww, hh]);
          }
        };

        const ratio = parseGuessAspect(opts.aspect, base);
        const includeCurrent = opts.dimMode === "current_only" || opts.dimMode === "current_swap" || opts.dimMode === "current_and_standards";
        const includeSwap = opts.dimMode === "current_swap";
        const includeStandards = opts.dimMode === "standards_only" || opts.dimMode === "current_and_standards";

        if (includeCurrent) {
          addDim(base.width, base.height);
        }
        if (includeSwap && base.width !== base.height) {
          addDim(base.height, base.width);
        }
        if (includeStandards) {
          for (const w of opts.widths) {
            const h = Math.max(1, Math.round(w / ratio));
            addDim(w, h);
          }
        }
        if (dims.length === 0) {
          addDim(base.width, base.height);
        }
        return dims;
      }

      function buildGuessCandidates(slot, opts) {
        const base = slot.settings;
        const dims = buildGuessDimensions(base, opts);
        const yuvFormats = ["nv12", "nv21", "nv16", "uyvy", "yuyv", "i420"];
        const yuvDepths = [...new Set([base.yuvBitDepth, 8, 10, 12])].filter((x) => x >= 8 && x <= 16);
        const rgbFormats = ["rgb24", "rgba32"];
        const bayerPatterns = ["RGGB", "BGGR", "GRBG", "GBRG"];
        const bayerEndians = opts.bayerBothEndians ? ["little", "big"] : [base.byteOrder];
        const bayerDepths = [...new Set([base.bayerBitDepth, 10, 12])].filter((x) => x >= 8 && x <= 16);
        const candidates = [{ ...base }];
        const wantsAny = opts.testYuv || opts.testRgb || opts.testBayer;
        const enableYuv = wantsAny ? opts.testYuv : true;
        const enableRgb = wantsAny ? opts.testRgb : true;
        const enableBayer = wantsAny ? opts.testBayer : true;

        for (const [w, h] of dims) {
          if (enableYuv) {
            for (const fmt of yuvFormats) {
              for (const depth of yuvDepths) {
                candidates.push({ ...base, width: w, height: h, format: fmt, yuvBitDepth: depth });
              }
            }
          }
          if (enableRgb) {
            for (const fmt of rgbFormats) {
              candidates.push({ ...base, width: w, height: h, format: fmt });
            }
          }
          if (enableBayer) {
            for (const patt of bayerPatterns) {
              for (const endian of bayerEndians) {
                candidates.push({ ...base, width: w, height: h, format: "bayer10mipi", bayerPattern: patt, byteOrder: endian, bayerBitDepth: 10 });
                candidates.push({ ...base, width: w, height: h, format: "bayer12mipi", bayerPattern: patt, byteOrder: endian, bayerBitDepth: 12 });
                for (const depth of bayerDepths) {
                  candidates.push({ ...base, width: w, height: h, format: "bayer16", bayerPattern: patt, bayerBitDepth: depth, byteOrder: endian });
                }
              }
            }
          }
        }

        const seen = new Set();
        const ranked = [];
        for (const c of candidates) {
          const k = candidateKey(c);
          if (seen.has(k)) continue;
          seen.add(k);
          const expected = estimateBytes(c);
          if (expected <= 0) continue;
          const ratio = slot.bytes.length / expected;
          const score = Math.abs(Math.log2(Math.max(1e-9, ratio)));
          ranked.push({ c, score });
        }

        ranked.sort((a, b) => a.score - b.score);
        const maxCandidates = Math.max(96, dims.length * 24);
        return ranked.slice(0, maxCandidates).map((x) => x.c);
      }

      async function runGuessMode() {
        const slot = slots[activeSlot];
        if (!slot.bytes || guessRunning) return;

        guessRunning = true;
        guessBtn.disabled = true;
        guessRunBtn.disabled = true;
        guessBtn.textContent = "Guessing...";
        guessGrid.innerHTML = "";
        setGuessOverlayVisible(true);

        try {
          const opts = readGuessOptions();
          const dims = buildGuessDimensions(slot.settings, opts);
          const candidates = buildGuessCandidates(slot, opts);
          guessInfo.textContent =
            `Rendering ${candidates.length} candidates (${dims.length} dimensions) for slot ${activeSlot + 1}. ` +
            `Click one to apply or close to keep current settings.`;

          for (const candidate of candidates) {
            await new Promise((resolve) => requestAnimationFrame(resolve));

            const card = document.createElement("button");
            card.type = "button";
            card.className = "guess-card";

            const label = document.createElement("div");
            label.className = "guess-label";
            label.textContent = settingsLabel(candidate);

            try {
              const decoded = decodeFrame(slot.bytes, candidate);
              const thumb = document.createElement("canvas");
              thumb.width = 320;
              thumb.height = 200;
              const tctx = thumb.getContext("2d");
              tctx.fillStyle = "#0b1017";
              tctx.fillRect(0, 0, thumb.width, thumb.height);
              tctx.imageSmoothingEnabled = false;
              const scale = Math.min(thumb.width / decoded.width, thumb.height / decoded.height);
              const dw = Math.max(1, decoded.width * scale);
              const dh = Math.max(1, decoded.height * scale);
              const dx = (thumb.width - dw) * 0.5;
              const dy = (thumb.height - dh) * 0.5;
              tctx.drawImage(decoded.canvas, dx, dy, dw, dh);

              card.append(thumb, label);
              card.addEventListener("click", () => applyGuessCandidate(candidate));
            } catch (err) {
              const errorLabel = document.createElement("div");
              errorLabel.className = "guess-label";
              errorLabel.textContent = `${settingsLabel(candidate)} (decode fail)`;
              card.append(errorLabel);
            }

            guessGrid.append(card);
          }
        } finally {
          guessRunning = false;
          guessBtn.disabled = false;
          guessRunBtn.disabled = false;
          guessBtn.textContent = "Guess Format";
        }
      }

      function attachEvents() {
        for (let i = 0; i < slotButtons.length; i += 1) {
          slotButtons[i].addEventListener("click", () => setActiveSlot(i));
        }

        profileSelect.addEventListener("change", () => {
          if (syncingControls) return;
          const slot = slots[activeSlot];
          applyProfile(profileSelect.value, slot);
          invalidateSlot(slot);
          syncControlsFromSlot();
          updateStatus();
          scheduleRender();
        });

        loadBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          await loadFileToActiveSlot(file);
          fileInput.value = "";
        });

        fitStatusBtn.addEventListener("click", () => {
          const decoded = getRenderTarget().decoded;
          if (!decoded) return;
          fitViewToImage(decoded);
          scheduleRender();
        });
        diffBtn.addEventListener("click", () => {
          setDiffMode(!diffMode);
        });
        saveBtn.addEventListener("click", () => {
          saveCurrentImage();
        });

        guessBtn.addEventListener("click", () => {
          runGuessMode();
        });
        guessRunBtn.addEventListener("click", () => {
          runGuessMode();
        });
        guessCloseBtn.addEventListener("click", () => {
          setGuessOverlayVisible(false);
        });
        const guessOptionControls = [
          guessDimModeSelect,
          guessAspectSelect,
          guessWidthsInput,
          guessYuvInput,
          guessRgbInput,
          guessBayerInput,
          guessBayerEndianBothInput
        ];
        for (const control of guessOptionControls) {
          control.addEventListener("keydown", (ev) => {
            if (ev.key === "Enter" && guessOverlay.classList.contains("open")) {
              runGuessMode();
            }
          });
        }
        saveProfileBtn.addEventListener("click", () => {
          saveCurrentProfile();
        });
        deleteProfileBtn.addEventListener("click", () => {
          deleteSelectedSavedProfile();
        });

        const controls = [
          formatSelect,
          widthInput,
          heightInput,
          offsetInput,
          stride0Input,
          stride1Input,
          stride2Input,
          byteOrderSelect,
          yuvBitDepthSelect,
          bayerBitDepthSelect,
          colorSpaceSelect,
          treatLinearInput,
          demosaicInput,
          swapUVInput,
          swapRBInput,
          bayerPatternSelect
        ];

        for (const control of controls) {
          control.addEventListener("input", readControlsToActiveSlot);
          control.addEventListener("change", readControlsToActiveSlot);
        }

        window.addEventListener("resize", scheduleRender);

        viewerCanvas.addEventListener("wheel", onWheel, { passive: false });
        viewerCanvas.addEventListener("mousedown", beginPan);
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", endPan);
        viewerCanvas.addEventListener("mouseleave", () => {
          pointerX = -1;
          pointerY = -1;
          scheduleRender();
        });
        viewerCanvas.addEventListener("mouseenter", onMouseMove);

        canvasWrap.addEventListener("dragover", (ev) => {
          ev.preventDefault();
        });

        canvasWrap.addEventListener("drop", async (ev) => {
          ev.preventDefault();
          if (!ev.dataTransfer || !ev.dataTransfer.files || !ev.dataTransfer.files[0]) return;
          await loadFileToActiveSlot(ev.dataTransfer.files[0]);
        });

        window.addEventListener("keydown", (ev) => {
          const target = ev.target;
          if (target instanceof HTMLElement) {
            const tag = target.tagName.toLowerCase();
            if (tag === "input" || tag === "select" || tag === "textarea") return;
          }

          if (ev.key === "1") {
            setActiveSlot(0);
          } else if (ev.key === "2") {
            setActiveSlot(1);
          } else if (ev.key === "3") {
            setActiveSlot(2);
          } else if (ev.key === "4") {
            setActiveSlot(3);
          } else if (ev.key === "f" || ev.key === "F") {
            const decoded = getRenderTarget().decoded;
            if (decoded) {
              fitViewToImage(decoded);
              scheduleRender();
            }
          } else if (ev.key === "0") {
            setDiffMode(!diffMode);
          } else if (ev.key === "Escape") {
            setGuessOverlayVisible(false);
          }
        });
      }

      function init() {
        savedProfiles = loadSavedProfiles();
        rebuildProfileSelect();
        populateFormats();
        attachEvents();
        loadDefaultNv12Sample(slots[0]);
        syncControlsFromSlot();
        updateSlotButtons();
        updateDiffButtonState();
        updateStatus();
        scheduleRender();
      }

      init();
    })();
  </script>
</body>
</html>
