<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sync Reader Icons</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f2;
      color: #18201c;
    }
    main {
      width: min(980px, calc(100% - 32px));
      margin: 32px auto;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .tile {
      background: #fff;
      border: 1px solid #d9dfd7;
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 10px;
      justify-items: start;
    }
    .icon {
      width: 28px;
      height: 28px;
      color: #0d7668;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    code {
      color: #657168;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <defs>
      <g id="placeholder"></g>
    </defs>
  </svg>
  <main>
    <h1>Sync Reader Icons</h1>
    <div class="grid" id="grid"></div>
  </main>
  <script>
    const iconIds = [
      "sr-book-open", "sr-library", "sr-search", "sr-plus", "sr-close", "sr-sidebar", "sr-swap",
      "sr-zen", "sr-eye", "sr-eye-off", "sr-graduation", "sr-cards", "sr-archive",
      "sr-export", "sr-trash", "sr-filter", "sr-more-vertical", "sr-settings",
      "sr-theme", "sr-sparkles"
    ];

    async function init() {
      const sprite = await fetch("./sync-reader-icons.svg").then((response) => response.text());
      document.body.insertAdjacentHTML("afterbegin", sprite);
      const grid = document.getElementById("grid");
      iconIds.forEach((id) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.innerHTML = `
          <svg class="icon" aria-hidden="true"><use href="./sync-reader-icons.svg#${id}"></use></svg>
          <code>${id}</code>
        `;
        grid.appendChild(tile);
      });
    }

    init();
  </script>
</body>
</html>
